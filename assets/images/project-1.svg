<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>
    <linearGradient id="p1-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="sphere-grad" x1="25%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <filter id="p1-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#p1-bg)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="320" x2="600" y2="320" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
  </g>

  <!-- Glowing Aura -->
  <circle cx="300" cy="190" r="120" fill="#0284c7" opacity="0.25" filter="url(#p1-glow)" />

  <!-- 3D Geometric Floating Elements -->
  <!-- Floating Torus Rings -->
  <ellipse cx="300" cy="200" rx="170" ry="60" fill="none" stroke="url(#p1-accent)" stroke-width="4" stroke-dasharray="8 12" transform="rotate(-20 300 200)" />
  <ellipse cx="300" cy="200" rx="140" ry="45" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="14 8" transform="rotate(30 300 200)" opacity="0.8" />

  <!-- Central Glowing 3D Sphere -->
  <circle cx="300" cy="190" r="75" fill="url(#sphere-grad)" filter="url(#p1-glow)" />
  <ellipse cx="275" cy="165" rx="20" ry="10" fill="#ffffff" opacity="0.6" transform="rotate(-30 275 165)" />

  <!-- Floating 3D Cubes & Polygons -->
  <polygon points="140,110 170,95 200,110 170,125" fill="#38bdf8" opacity="0.8" />
  <polygon points="140,110 170,125 170,155 140,140" fill="#0284c7" opacity="0.9" />
  <polygon points="200,110 170,125 170,155 200,140" fill="#0369a1" opacity="0.7" />

  <polygon points="430,260 460,245 490,260 460,275" fill="#facc15" opacity="0.8" />
  <polygon points="430,260 460,275 460,305 430,290" fill="#eab308" opacity="0.9" />
  <polygon points="490,260 460,275 460,305 490,290" fill="#ca8a04" opacity="0.7" />

  <!-- Tag Overlay -->
  <rect x="30" y="325" width="130" height="32" rx="16" fill="rgba(15,23,42,0.85)" stroke="#38bdf8" stroke-width="1" />
  <text x="95" y="346" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle">MOTION GRAPHIC</text>

  <text x="30" y="380" fill="#f8fafc" font-family="'Kanit', sans-serif" font-weight="600" font-size="20">LUMINA: 3D Motion Identity</text>
</svg>
