<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091426" />
      <stop offset="60%" stop-color="#0e2238" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="p3-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="p3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#p3-bg)" />

  <!-- Code elements background -->
  <text x="30" y="60" fill="#38bdf8" opacity="0.15" font-family="monospace" font-size="14">&lt;section class="canvas-experience"&gt;</text>
  <text x="50" y="85" fill="#facc15" opacity="0.15" font-family="monospace" font-size="14">const shader = new Three.WebGLRenderer();</text>
  <text x="50" y="110" fill="#38bdf8" opacity="0.15" font-family="monospace" font-size="14">requestAnimationFrame(renderLoop);</text>

  <!-- Laptop / Browser Window Mockup -->
  <g transform="translate(80, 50)" filter="url(#p3-shadow)">
    <!-- Browser Window Header -->
    <rect width="440" height="230" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 0 0 h 440 a 16 16 0 0 1 16 16 v 24 h -472 v -24 a 16 16 0 0 1 16 -16 z" fill="#1e293b" />
    
    <!-- Window Controls -->
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="40" cy="20" r="5" fill="#facc15" />
    <circle cx="56" cy="20" r="5" fill="#22c55e" />

    <!-- Address Bar -->
    <rect x="80" y="10" width="240" height="20" rx="10" fill="#0f172a" />
    <text x="100" y="24" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">https://chroma-exhibition.creative</text>

    <!-- Canvas Inner Display -->
    <rect x="15" y="52" width="410" height="162" rx="10" fill="#030712" />
    <!-- Dynamic Wave Graphic inside screen -->
    <path d="M 15 150 Q 110 80, 210 140 T 425 110 L 425 214 L 15 214 Z" fill="url(#p3-screen)" opacity="0.75" />
    <path d="M 15 170 Q 110 110, 220 160 T 425 140 L 425 214 L 15 214 Z" fill="#0284c7" opacity="0.6" />

    <text x="40" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" letter-spacing="1">CHROMA 2026</text>
    <text x="40" y="115" fill="#facc15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">INTERACTIVE SPATIAL SHOWCASE</text>
    
    <rect x="40" y="130" width="75" height="22" rx="11" fill="#facc15" />
    <text x="77" y="145" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" text-anchor="middle">EXPLORE</text>
  </g>

  <!-- Tag Overlay -->
  <rect x="30" y="325" width="115" height="32" rx="16" fill="rgba(15,23,42,0.85)" stroke="#38bdf8" stroke-width="1" />
  <text x="87" y="346" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle">WEB DESIGN</text>

  <text x="30" y="380" fill="#f8fafc" font-family="'Kanit', sans-serif" font-weight="600" font-size="20">Chroma: Interactive Web Experience</text>
</svg>
