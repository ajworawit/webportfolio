<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p5-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b2f" />
      <stop offset="50%" stop-color="#142c4c" />
      <stop offset="100%" stop-color="#021021" />
    </linearGradient>
    <linearGradient id="lens-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <radialGradient id="aperture-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#p5-bg)" />

  <!-- Camera Viewfinder Grid & Overlays -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4">
    <!-- Viewfinder Corners -->
    <path d="M 50 80 L 50 50 L 80 50" fill="none" />
    <path d="M 520 50 L 550 50 L 550 80" fill="none" />
    <path d="M 50 250 L 50 280 L 80 280" fill="none" />
    <path d="M 520 280 L 550 280 L 550 250" fill="none" />
    <!-- Center Target Crosshair -->
    <circle cx="300" cy="165" r="10" fill="none" stroke="#facc15" />
    <line x1="280" y1="165" x2="290" y2="165" stroke="#facc15" />
    <line x1="310" y1="165" x2="320" y2="165" stroke="#facc15" />
    <line x1="300" y1="145" x2="300" y2="155" stroke="#facc15" />
    <line x1="300" y1="175" x2="300" y2="185" stroke="#facc15" />
  </g>

  <!-- Big Camera Aperture / Lens Rings in Center -->
  <circle cx="300" cy="165" r="115" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
  <circle cx="300" cy="165" r="105" fill="#090d16" stroke="#facc15" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="300" cy="165" r="90" fill="none" stroke="url(#lens-amber)" stroke-width="8" />

  <!-- Aperture Blades (Hexagonal/Octagonal Geometric illusion) -->
  <polygon points="300,90 350,115 375,165 350,215 300,240 250,215 225,165 250,115" fill="#040812" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="300" cy="165" r="55" fill="url(#aperture-glow)" />

  <!-- Lens Flare Reflections -->
  <ellipse cx="270" cy="135" rx="35" ry="16" fill="#38bdf8" opacity="0.4" transform="rotate(-30 270 135)" />
  <ellipse cx="330" cy="195" rx="25" ry="10" fill="#facc15" opacity="0.5" transform="rotate(-30 330 195)" />

  <!-- Camera Metadata Readouts -->
  <text x="60" y="70" fill="#facc15" font-family="'Plus Jakarta Sans', monospace" font-size="11" font-weight="700">[REC] 00:12:45</text>
  <text x="60" y="270" fill="#cbd5e1" font-family="'Plus Jakarta Sans', monospace" font-size="11">ISO 200 • 50mm f/1.4 • 1/500s</text>
  <text x="540" y="270" fill="#38bdf8" font-family="'Plus Jakarta Sans', monospace" font-size="11" text-anchor="end">RAW 14-BIT</text>

  <!-- Tag Overlay -->
  <rect x="30" y="325" width="125" height="32" rx="16" fill="rgba(15,23,42,0.85)" stroke="#38bdf8" stroke-width="1" />
  <text x="92" y="346" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle">PHOTOGRAPHY</text>

  <text x="30" y="380" fill="#f8fafc" font-family="'Kanit', sans-serif" font-weight="600" font-size="20">Urban Perspectives: Architecture</text>
</svg>
