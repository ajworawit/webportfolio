<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07192f" />
      <stop offset="50%" stop-color="#0f2942" />
      <stop offset="100%" stop-color="#05101e" />
    </linearGradient>
    <linearGradient id="p2-phone-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="p2-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="p2-gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="p2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#p2-bg)" />

  <!-- Ambient Blue and Gold glow -->
  <circle cx="200" cy="180" r="130" fill="#0284c7" opacity="0.2" filter="blur(30px)" />
  <circle cx="420" cy="220" r="100" fill="#facc15" opacity="0.15" filter="blur(30px)" />

  <!-- Smartphone Mockup 1 (Primary - Center Left) -->
  <g transform="translate(180, 40)" filter="url(#p2-shadow)">
    <!-- Phone Bezel -->
    <rect width="180" height="310" rx="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Screen -->
    <rect x="8" y="8" width="164" height="294" rx="24" fill="url(#p2-phone-bg)" />
    <!-- Dynamic Island / Speaker -->
    <rect x="65" y="14" width="50" height="10" rx="5" fill="#090d16" />
    
    <!-- App Header -->
    <circle cx="28" cy="42" r="12" fill="#334155" />
    <rect x="46" y="38" width="60" height="8" rx="4" fill="#94a3b8" />
    <circle cx="150" cy="42" r="6" fill="#facc15" />

    <!-- Featured Glass Balance Card -->
    <rect x="18" y="62" width="144" height="74" rx="14" fill="url(#p2-card-grad)" />
    <rect x="30" y="74" width="50" height="6" rx="3" fill="#e0f2fe" opacity="0.8" />
    <text x="30" y="100" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16">฿ 24,850</text>
    <rect x="30" y="112" width="60" height="12" rx="6" fill="#0369a1" />
    <text x="45" y="121" fill="#bae6fd" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700">+18.5%</text>

    <!-- Mini Action Buttons -->
    <rect x="18" y="146" width="30" height="30" rx="10" fill="#1e293b" stroke="#334155" />
    <rect x="56" y="146" width="30" height="30" rx="10" fill="#1e293b" stroke="#334155" />
    <rect x="94" y="146" width="30" height="30" rx="10" fill="#1e293b" stroke="#334155" />
    <rect x="132" y="146" width="30" height="30" rx="10" fill="url(#p2-gold-grad)" />

    <!-- Feed / List items -->
    <rect x="18" y="188" width="144" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <circle cx="34" cy="206" r="10" fill="#38bdf8" />
    <rect x="52" y="200" width="60" height="6" rx="3" fill="#cbd5e1" />
    <rect x="52" y="210" width="35" height="4" rx="2" fill="#64748b" />

    <rect x="18" y="232" width="144" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <circle cx="34" cy="250" r="10" fill="#facc15" />
    <rect x="52" y="244" width="70" height="6" rx="3" fill="#cbd5e1" />
    <rect x="52" y="254" width="40" height="4" rx="2" fill="#64748b" />

    <!-- Bottom Nav -->
    <line x1="20" y1="280" x2="160" y2="280" stroke="#334155" stroke-width="0.8" />
    <circle cx="45" cy="290" r="4" fill="#38bdf8" />
    <circle cx="90" cy="290" r="4" fill="#64748b" />
    <circle cx="135" cy="290" r="4" fill="#64748b" />
  </g>

  <!-- Smartphone Mockup 2 (Angled / Background Right) -->
  <g transform="translate(350, 75) rotate(12)" filter="url(#p2-shadow)" opacity="0.85">
    <rect width="150" height="260" rx="26" fill="#1e293b" stroke="#facc15" stroke-width="1.5" />
    <rect x="6" y="6" width="138" height="248" rx="20" fill="#0f172a" />
    <rect x="18" y="30" width="114" height="60" rx="10" fill="url(#p2-gold-grad)" />
    <!-- Bar chart simulation -->
    <rect x="25" y="125" width="14" height="45" rx="3" fill="#38bdf8" />
    <rect x="47" y="110" width="14" height="60" rx="3" fill="#facc15" />
    <rect x="69" y="135" width="14" height="35" rx="3" fill="#38bdf8" />
    <rect x="91" y="95" width="14" height="75" rx="3" fill="#facc15" />
  </g>

  <!-- Tag Overlay -->
  <rect x="30" y="325" width="105" height="32" rx="16" fill="rgba(15,23,42,0.85)" stroke="#facc15" stroke-width="1" />
  <text x="82" y="346" fill="#facc15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle">UI/UX DESIGN</text>

  <text x="30" y="380" fill="#f8fafc" font-family="'Kanit', sans-serif" font-weight="600" font-size="20">NEXUS: Smart Campus Life App</text>
</svg>
