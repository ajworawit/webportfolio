<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p6-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#19194d" />
      <stop offset="100%" stop-color="#0b1b3a" />
    </linearGradient>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="p6-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#p6-bg)" />

  <!-- Neural Network Connections -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.35">
    <line x1="120" y1="120" x2="200" y2="90" />
    <line x1="120" y1="120" x2="190" y2="170" />
    <line x1="200" y1="90" x2="300" y2="130" />
    <line x1="190" y1="170" x2="300" y2="130" />
    <line x1="300" y1="130" x2="400" y2="100" />
    <line x1="300" y1="130" x2="410" y2="180" />
    <line x1="400" y1="100" x2="480" y2="140" />
    <line x1="410" y1="180" x2="480" y2="140" />
    <line x1="200" y1="230" x2="300" y2="210" />
    <line x1="300" y1="210" x2="410" y2="240" />
  </g>

  <!-- Network Nodes -->
  <circle cx="120" cy="120" r="6" fill="#38bdf8" />
  <circle cx="200" cy="90" r="8" fill="#facc15" />
  <circle cx="190" cy="170" r="5" fill="#38bdf8" />
  <circle cx="400" cy="100" r="7" fill="#facc15" />
  <circle cx="410" cy="180" r="8" fill="#38bdf8" />
  <circle cx="480" cy="140" r="6" fill="#ec4899" />
  <circle cx="200" cy="230" r="6" fill="#38bdf8" />
  <circle cx="410" cy="240" r="5" fill="#facc15" />

  <!-- Central AI Core Hologram -->
  <g filter="url(#p6-glow)">
    <!-- Concentric Cyber Rings -->
    <circle cx="300" cy="165" r="75" fill="none" stroke="url(#cyber-grad)" stroke-width="3" stroke-dasharray="14 10" />
    <circle cx="300" cy="165" r="50" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="8 6" />
    <circle cx="300" cy="165" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    
    <!-- AI Brain / Sparkle Icon in Center -->
    <path d="M 292 165 Q 300 150 308 165 Q 300 180 292 165 Z" fill="#facc15" />
    <circle cx="300" cy="165" r="4" fill="#ffffff" />
  </g>

  <!-- Prompt Bar Visual Mockup -->
  <rect x="130" y="260" width="340" height="36" rx="18" fill="rgba(15,23,42,0.9)" stroke="#38bdf8" stroke-width="1.2" />
  <text x="150" y="283" fill="#facc15" font-family="'Plus Jakarta Sans', monospace" font-size="11">prompt: "hyperrealistic spatial light..."</text>
  <rect x="420" y="266" width="40" height="24" rx="12" fill="#38bdf8" />
  <text x="440" y="282" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" text-anchor="middle">GEN</text>

  <!-- Tag Overlay -->
  <rect x="30" y="325" width="135" height="32" rx="16" fill="rgba(15,23,42,0.85)" stroke="#facc15" stroke-width="1" />
  <text x="97" y="346" fill="#facc15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle">AI & CREATIVE MEDIA</text>

  <text x="30" y="380" fill="#f8fafc" font-family="'Kanit', sans-serif" font-weight="600" font-size="20">Synthetica: Generative Spatial Art</text>
</svg>
